services:
  db:
    image: postgres:16
    container_name: postgres-dev
    restart: unless-stopped
    env_file:
      - ../.env
    # Só a própria máquina alcança o banco (F05). Sem o 127.0.0.1, o Docker publica em todas as interfaces.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: